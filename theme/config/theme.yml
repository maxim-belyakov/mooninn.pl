# Mooninn child theme of Hummingbird (PrestaShop 9.2).
# Lives in the mooninn.pl repo under theme/ and is deployed to themes/mooninn.
parent: hummingbird
name: mooninn
display_name: Mooninn
version: 1.0.0
author:
  name: "Mooninn"
  url: "https://mooninn.pl/"

assets:
  use_parent_assets: true
  css:
    all:
      - id: mooninn-custom
        path: assets/css/custom.css
        media: all
        priority: 1000

meta:
  compatibility:
    from: 9.2.0
    to: ~9.2.0
    framework: bootstrap-v5.3.3

  available_layouts:
    layout-full-width:
      name: Full Width
      description: No side columns, ideal for distraction-free pages such as product pages.
    layout-both-columns:
      name: Three Columns
      description: One large central column and 2 side columns.
    layout-left-column:
      name: Two Columns, small left column
      description: Two columns with a small left column
    layout-right-column:
      name: Two Columns, small right column
      description: Two columns with a small right column

global_settings:
  configuration:
    PS_IMAGE_QUALITY: png
    HOME_FEATURED_NBR: 4
    NEW_PRODUCTS_NBR: 4
    BLOCKSPECIALS_SPECIALS_NBR: 4
    PS_BLOCK_BESTSELLERS_TO_DISPLAY: 4
    PRODUCTS_VIEWED_NBR: 4
    CATEGORYPRODUCTS_DISPLAY_PRODUCTS: 4
    PSR_ICON_COLOR: "#0b69f6"
    PSR_TEXT_COLOR: "#212529"
  modules:
    to_disable:
      - blockwishlist
      - ps_brandlist
      - ps_supplierlist
  hooks:
    modules_to_unhook:
      displayFooter:
        - ps_socialfollow
      displaySearch:
        - ps_searchbar
    modules_to_hook:
      displayAfterBodyOpeningTag:
        - blockreassurance
        # Keep existing hooks and append them after
        - ~
      displayNav1:
        - ps_contactinfo
        # Keep existing hooks and append them after
        - ~
      displayNav2:
        - ps_languageselector
        - ps_currencyselector
        - ps_customersignin
        - ps_shoppingcart
        # Keep existing hooks and append them after
        - ~
      displayNavFullWidth:
        - blockreassurance
        # Keep existing hooks and append them after
        - ~
      displayTop:
        - ps_mainmenu
        - ps_searchbar
        # Keep existing hooks and append them after
        - ~
      displayHome:
        - ps_featuredproducts
        - ps_newproducts
        - ps_bestsellers
        # Keep existing hooks and append them after
        - ~
      displayFooterBefore:
        - ps_socialfollow
        - ps_emailsubscription
        - blockreassurance
        # Keep existing hooks and append them after
        - ~
      displayFooter:
        - ps_linklist
        - ps_customeraccountlinks
        - ps_contactinfo
        # Keep existing hooks and append them after
        - ~
      displayFooterAfter:
        - blockreassurance
        # Keep existing hooks and append them after
        - ~
      displayLeftColumn:
        - ps_categorytree
        - ps_facetedsearch
        # Keep existing hooks and append them after
        - ~
      displayContactLeftColumn:
        - ps_contactinfo
        # Keep existing hooks and append them after
        - ~
      displayContactRightColumn:
        - ps_contactinfo
        # Keep existing hooks and append them after
        - ~
      displayContactContent:
        - contactform
        # Keep existing hooks and append them after
        - ~
      displayProductAdditionalInfo:
        - ps_sharebuttons
        - productcomments
        - ps_emailalerts
        - ps_viewedproduct
        # Keep existing hooks and append them after
        - ~
      displayProductListReviews:
        - productcomments
        # Keep existing hooks and append them after
        - ~
      displayFooterProduct:
        - productcomments
        - ps_categoryproducts
        - ps_viewedproduct
        # Keep existing hooks and append them after
        - ~
      displayCrossSellingShoppingCart:
        - ps_featuredproducts
        # Keep existing hooks and append them after
        - ~
      displayOrderConfirmation2:
        - ps_featuredproducts
        # Keep existing hooks and append them after
        - ~
      displayReassurance:
        - blockreassurance
        # Keep existing hooks and append them after
        - ~
      displayCustomerAccount:
        - ps_emailalerts
        - psgdpr
        # Keep existing hooks and append them after
        - ~
      displayGDPRConsent:
        - psgdpr
        # Keep existing hooks and append them after
        - ~

  image_types:
    cart_default:
      width: 125
      height: 188
      scope: [products]
    small_default:
      width: 98
      height: 147
      scope: [products, categories, manufacturers, suppliers]
    medium_default:
      width: 452
      height: 678
      scope: [products, manufacturers, suppliers]
    large_default:
      width: 800
      height: 1200
      scope: [products, manufacturers, suppliers]
    home_default:
      width: 250
      height: 375
      scope: [products]
    category_default:
      width: 180
      height: 180
      scope: [categories]
    stores_default:
      width: 287
      height: 160
      scope: [stores]
    default_xs:
      width: 160
      height: 240
      scope: [products, manufacturers, suppliers, categories]
    default_sm:
      width: 216
      height: 324
      scope: [categories, products]
    default_md:
      width: 261
      height: 392
      scope: [manufacturers, suppliers, products, categories]
    default_lg:
      width: 336
      height: 504
      scope: [categories, products]
    default_xl:
      width: 400
      height: 600
      scope: [products]
    product_main:
      width: 720
      height: 1080
      scope: [products]
    category_cover:
      width: 1000
      height: 200
      scope: [categories]
    product_main_2x:
      width: 1440
      height: 2160
      scope: [products]
    category_cover_2x:
      width: 2000
      height: 400
      scope: [categories]
    manufacturer_product_page:
      width: 98
      height: 98
      scope: [manufacturers]
      image_fitment: bound

theme_settings:
  rtl_generation: false
  default_layout: layout-full-width
  layouts:
    category: layout-left-column
    best-sales: layout-left-column
    new-products: layout-left-column
    prices-drop: layout-left-column
    contact: layout-left-column
    manufacturer: layout-left-column
    supplier: layout-left-column
