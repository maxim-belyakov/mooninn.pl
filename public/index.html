<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mooninn</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      background: #14161f; color: #f1ead8; text-align: center; padding: 16px;
    }
    .moon { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 24px;
      box-shadow: inset -18px -6px 0 0 #f1ead8; transform: rotate(-20deg); }
    h1 { font-weight: 400; letter-spacing: 0.08em; margin: 0 0 8px; font-size: 2.2rem; }
    p { margin: 0; opacity: 0.7; }
  </style>
</head>
<body>
  <main>
    <div class="moon" aria-hidden="true"></div>
    <h1>Mooninn</h1>
    <p>Strona wkrótce</p>
  </main>
</body>
</html>
