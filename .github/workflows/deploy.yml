name: Deploy theme to Namecheap

# Push to master deploys theme/ (the Mooninn child theme of Hummingbird) to
# public_html/themes/mooninn. Nothing else on the server is touched: the shop,
# its database and uploads live only on the server.
on:
  push:
    branches:
      - master
    paths:
      - 'theme/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SSH_TARGET: moonmrys@server107.web-hosting.com
  SSH_OPTS: -i ~/.ssh/deploy_key -p 21098 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key of server107.web-hosting.com (port 21098)
          echo '[server107.web-hosting.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIggDfLOh/YXdKv2wNdrU+rm7yw4VWetIZ9U2W1Wt8KQ' > ~/.ssh/known_hosts

      - name: Deploy theme
        run: |
          # themes/.htaccess only serves assets, so the version marker is a .css file
          echo "/* $GITHUB_SHA */" > theme/version.css
          # --delete is scoped to themes/mooninn only
          # assets/cache holds PrestaShop's combined CSS/JS; it is not in git, keep it out of --delete
          rsync -rlz --delete --exclude 'assets/cache/' --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh $SSH_OPTS" \
            theme/ "$SSH_TARGET:public_html/themes/mooninn/"
          # Drop compiled templates and the Symfony cache so changes show up at once
          # and drop the combined CSS/JS so it is rebuilt from the new files
          ssh $SSH_OPTS "$SSH_TARGET" 'rm -rf ~/public_html/var/cache/prod/smarty/compile/* ~/public_html/var/cache/prod/smarty/cache/* ~/public_html/themes/mooninn/assets/cache/*.css ~/public_html/themes/mooninn/assets/cache/*.js'
          # Browsers cache combined files for a week by name; bump PrestaShop's CCC versions so the names change
          ssh $SSH_OPTS "$SSH_TARGET" 'cd ~/public_html && php -r "require \"config/config.inc.php\"; foreach ([\"PS_CCCCSS_VERSION\", \"PS_CCCJS_VERSION\"] as \$k) { Configuration::updateValue(\$k, (int) Configuration::get(\$k) + 1); }" 2>/dev/null'

      - name: Smoke test
        run: |
          # The shop is in maintenance mode (503 for visitors), so check the theme file directly
          live=$(curl -s "https://mooninn.pl/themes/mooninn/version.css?t=$(date +%s)")
          echo "live theme version: $live"
          test "$live" = "/* $GITHUB_SHA */"
          code=$(curl -s -o /dev/null -w '%{http_code}' https://mooninn.pl/themes/mooninn/assets/css/custom.css)
          echo "custom.css -> $code"
          test "$code" = "200"
