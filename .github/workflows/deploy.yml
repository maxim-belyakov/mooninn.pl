name: Deploy to Namecheap

# Paused 28.10.2026: public_html now hosts PrestaShop, and rsync --delete
# would wipe it. This workflow will be rewritten to deploy only the shop
# theme (themes/mooninn). Until then it runs only by hand and refuses to deploy.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse while paused
        run: |
          echo "Deploy is paused: public_html now hosts PrestaShop. See the comment at the top of this file."
          exit 1

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key of server107.web-hosting.com (port 21098)
          echo '[server107.web-hosting.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIggDfLOh/YXdKv2wNdrU+rm7yw4VWetIZ9U2W1Wt8KQ' > ~/.ssh/known_hosts

      - name: Deploy public/ to public_html
        run: |
          echo "$GITHUB_SHA" > public/version.txt
          rsync -az --delete \
            --exclude '.well-known/' \
            --exclude 'cgi-bin/' \
            --exclude 'nc_assets/' \
            --exclude 'parking-page.shtml' \
            -e "ssh -i ~/.ssh/deploy_key -p 21098 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            public/ moonmrys@server107.web-hosting.com:public_html/
          # rsync copies the mode of public/ onto public_html; cPanel expects 750
          ssh -i ~/.ssh/deploy_key -p 21098 -o IdentitiesOnly=yes moonmrys@server107.web-hosting.com 'chmod 750 ~/public_html'

      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://mooninn.pl/)
          echo "https://mooninn.pl -> $code"
          test "$code" = "200"
          # the live site must serve this commit
          live=$(curl -s "https://mooninn.pl/version.txt?t=$(date +%s)")
          echo "live version: $live"
          test "$live" = "$GITHUB_SHA"
